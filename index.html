<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MetriX Train</title>
<meta name="theme-color" content="#070d1c">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#070d1c;--solid:#0b1426;--s1:#0f1a33;--s2:#16233f;--s0:#0b1428;--line:#1f2d4d;--line2:#34466b;--ink:#eaf2ff;--ink2:#c7d6ee;--dim:#8b9bb8;--acc:#38e1c6;--vio:#ff7ad9;--ok:#7de3a0;--warn:#f5c040;--disp:"Barlow Condensed",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#070d1c}
body{margin:0;min-height:100vh;background:#070d1c;color:var(--ink);font:16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto;padding:16px 16px 24px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
h2{font-family:var(--disp);font-size:34px;font-weight:700;text-transform:uppercase;letter-spacing:-.2px;margin:4px 0 14px}
h3{font-size:16px;margin:0 0 8px}
p{margin:0 0 8px;color:var(--dim)}
small,.sub{color:var(--dim);font-size:12.5px}
b{font-weight:650}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card.hl{border-color:var(--acc)}
.card.warn{border-color:var(--warn)}
.card ol,.card ul{margin:0 0 8px;padding-left:20px;color:var(--dim)}
.card li{margin-bottom:4px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.6px;border:1px solid var(--acc);color:var(--acc);border-radius:6px;padding:1px 7px;margin-bottom:6px}
.card.warn .tag{border-color:var(--warn);color:var(--warn)}
.cap{font-size:11px;font-weight:600;letter-spacing:.8px;color:var(--dim);margin:2px 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:block;width:100%;background:var(--acc);color:#04202a;letter-spacing:.3px;font-weight:700;border-radius:14px;padding:16px;text-align:center;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.btn.danger{background:#3a1218;color:#ffb4b4;border:1px solid #6b1f2a}
.row .btn{flex:1;width:auto}
.row .btn.sm{flex:none;width:96px;font-size:14px;font-weight:600}
.mini{background:transparent;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}
/* home */
.hdr{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.hdr small{display:block}
.hdr h2{margin:2px 0 0}
.wk{border:1px solid var(--line2);border-radius:8px;padding:4px 9px;font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--ink2);white-space:nowrap}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--s0);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center}
.tile label{margin:8px 0 0;text-align:left}
.tile input{height:44px;text-align:center;font-size:16px;font-weight:600}
.ringw{position:relative;width:96px;height:96px;margin:0 auto 6px}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringc b{font-family:var(--disp);font-size:22px;font-weight:700}
.ringc small{font-size:11px}
.rsub{font-size:12px;color:var(--ink2);margin-bottom:6px;min-height:17px}
.rtag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;border:1px solid;border-radius:6px;padding:2px 7px}
.hero{background:var(--acc);border:0;color:#04202a}
.hhero{margin:-16px -16px 16px;padding:26px 20px 20px;background:linear-gradient(180deg,#10304d 0%,#070d1c 100%)}
.hhero .tl{font-family:var(--disp);font-weight:700;font-size:62px;line-height:.95;text-transform:uppercase;letter-spacing:-.5px;margin-top:14px}
.seg8{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:16px}
.seg8 i{height:6px;border-radius:3px;background:#1f2d4d}
.seg8 i.on{background:var(--acc)}
.mt{display:flex;justify-content:space-between;align-items:center}
.hero .name{font-family:var(--disp);font-weight:700;font-size:56px;line-height:.9;text-transform:uppercase}
.bar{height:10px;border-radius:5px;background:#1f2d4d;margin-top:6px}
.bar i{display:block;height:10px;border-radius:5px}
.brow{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.brow b{font-family:var(--disp);font-size:22px;font-weight:700}
.hero p,.hero small{color:#04202a}
.hero .tag{border-color:#04202a;color:#04202a}
.hero .pills span{background:rgba(4,32,42,.14);color:#04202a}
.hero .btn{background:#070d1c;color:#eaf2ff;letter-spacing:.8px;text-transform:uppercase}
.hero .btn.ghost{background:transparent;color:#04202a;border:1px solid #04202a}
.hi{color:var(--acc)}
.today{display:flex;align-items:center;gap:16px}
.dual{flex:none;width:120px;height:120px}
.stats{flex:1;display:flex;flex-direction:column;gap:12px}
.stat small{display:block}
.stat b{font-family:var(--disp);font-size:26px;font-weight:700}
.stat b small{display:inline;font-weight:500}
.stat .st{display:block;font-size:10.5px;font-weight:700;letter-spacing:.5px}
.ins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.ins label{margin:0}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.three label{margin:0}
.three input{height:46px;text-align:center;font-size:16px;font-weight:600;padding:8px 4px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.frow small{display:block}
.ins input{height:46px;text-align:center;font-size:16px;font-weight:600}
.big{font-family:var(--disp);text-transform:uppercase;font-size:40px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.chip{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:9px 2px;text-align:center;font-size:12px}
.chip b{display:block;font-size:12px}
.chip span{display:block;margin-top:3px;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--dim)}
.chip.next{border-color:var(--acc)}.chip.next span{color:var(--acc)}
.chip.dn span{color:var(--ok)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.pills span{font-size:12px;background:var(--s2);border-radius:8px;padding:5px 9px;color:var(--ink2)}
.pills span.m{color:var(--dim)}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);color:var(--ink);font-size:14px}
ul.list li:last-child{border:0}ul.list li span{color:var(--dim);white-space:nowrap}
label{display:block;margin-bottom:10px;color:var(--dim);font-size:13px}
label input,label select,textarea{display:block;width:100%;margin-top:4px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.item{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px}
.item .r{text-align:right}.item small{display:block}
/* workout */
.wh{position:sticky;top:0;z-index:5;background:#070d1c;display:flex;align-items:center;gap:12px;padding:10px 0 12px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.wh b{font-family:var(--disp);font-size:26px;text-transform:uppercase}
.wh small{display:block}
.wh .mini{flex:none;height:40px}
.pbar{position:absolute;left:0;right:0;bottom:-1px;height:4px;background:var(--line)}
.pbar i{display:block;height:4px;background:var(--acc);transition:width .3s}
.pad{padding-bottom:110px}
.ex{background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.ex.open{border-color:var(--acc)}
.exh{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;padding:13px 14px}
.exh b{font-size:15px;font-weight:600}
.exh .cnt{font-weight:700;font-size:12px;letter-spacing:.4px;white-space:nowrap;border:1px solid var(--line2);color:var(--ink2);border-radius:8px;padding:3px 8px}
.ex.complete .cnt{border-color:var(--ok);color:var(--ok)}
.ex>.bd{padding:0 14px 14px}
.cue{color:var(--dim);font-size:13.5px;margin-bottom:8px}
.sug{background:var(--s2);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45;color:var(--ink2);margin-bottom:8px}
.sug .mini{display:block;margin-top:8px;background:var(--acc);border-color:var(--acc);color:#04202a;font-weight:700}
.last{font-size:13px;color:var(--dim);margin-bottom:8px}
.cols,.set{display:grid;grid-template-columns:24px 1fr 1fr 64px;gap:8px;align-items:center}
.cols{font-size:11.5px;color:var(--dim);text-align:center}
.set{margin:8px 0}
.set.nw,.cols.nw{grid-template-columns:24px 1fr 64px}
.sn{color:var(--dim);font-weight:700;text-align:center}
.stp{display:flex;align-items:stretch;background:var(--s2);border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.stp button{width:38px;font-size:22px;text-align:center;color:var(--dim)}
.stp input{width:100%;min-width:0;text-align:center;background:transparent;border:0;outline:0;font-weight:650;font-size:18px;height:52px;-moz-appearance:textfield;margin:0;padding:0;border-radius:0}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dn{height:52px;border-radius:12px;border:1px solid var(--line2);background:transparent;color:var(--ink2);font-weight:700;font-size:13px;text-align:center}
.set.done .dn{background:var(--ok);border-color:var(--ok);color:#06140c}
.set.done .stp{opacity:.65}
.ex .row{margin-top:8px}
.tbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#0b1426;border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.tbar .fill{position:absolute;left:0;top:0;height:3px;background:var(--acc);width:0;transition:width .5s linear}
.tin{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tin b{font-family:var(--disp);font-size:40px;display:block;line-height:1}
.tin small{display:block;margin-top:3px}
.tin .mini{height:44px}
/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:#0b1426;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--dim);border-top:3px solid transparent}
#tabs button svg{width:22px;height:22px}
#tabs button.on{color:var(--ink);font-weight:700;border-top-color:var(--acc)}
.ovl{position:fixed;inset:0;z-index:30;background:rgba(3,8,20,.74);animation:fadein .3s ease}
.tpop{position:fixed;z-index:31;left:50%;top:50%;width:min(342px,calc(100vw - 32px));transform:translate(-50%,-50%);background:var(--solid);border:1px solid var(--acc);border-radius:28px;padding:22px 20px 20px;text-align:center;animation:popin .45s cubic-bezier(.2,1.5,.4,1)}
.tpop .hide{position:absolute;top:12px;right:12px;padding:6px 10px;font-size:12px}
.tpop .pl{font-size:12px;font-weight:600;letter-spacing:1.2px;color:var(--acc);margin:0 56px}
.tpop .pw{position:relative;width:200px;height:200px;margin:12px auto 8px;border-radius:50%}
.tpop .pw svg{display:block}
.tpop .pw circle{transition:stroke-dashoffset .4s linear}
.tpop .pc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tpop .pc b{font-family:var(--disp);font-size:64px;font-weight:700;line-height:1;letter-spacing:-1px}
.tpop .pc small{margin-top:4px}
.tpop .pn{font-size:14px;color:var(--ink2);margin-bottom:16px}
.tpop .row{flex-wrap:nowrap}
.tpop .btn{padding:15px 10px;font-size:15px}
.tpop.ready .pw{animation:rdy .9s ease-out infinite}
@keyframes popin{from{opacity:0;transform:translate(-50%,-46%) scale(.82)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rdy{0%,100%{box-shadow:0 0 0 0 rgba(56,225,198,.55)}50%{box-shadow:0 0 0 20px rgba(56,225,198,0)}}
@media (prefers-reduced-motion:reduce){.tpop,.ovl,.tpop.ready .pw{animation:none}}
.chart{width:100%;height:auto;margin:4px 0 8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);color:var(--dim)}
td:first-child{color:var(--ink)}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg .mini{flex:1;text-align:center;height:40px;color:var(--dim);font-weight:500}.seg .mini.on{border-color:var(--acc);background:var(--s2);color:var(--ink);font-weight:700}
.chk{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:15px}.chk input{width:22px;height:22px;margin:0;display:inline-block}
.bars{width:100%;height:auto;margin:6px 0 2px}
.card.sm{padding:12px;margin:0}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-80px);background:var(--s2);border:1px solid var(--acc);border-radius:10px;padding:10px 14px;z-index:50;transition:transform .25s;max-width:90%}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<main id="app"></main>
<nav id="tabs" aria-label="Main">
  <button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Train</button>
  <button data-go="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>
  <button data-go="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9"/></svg>Progress</button>
  <button data-go="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg>Info</button>
  <button data-go="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</button>
</nav>
<script src="program.js?v=1.7.0"></script>
<script src="app.js?v=1.7.0"></script>
</body>
</html>
