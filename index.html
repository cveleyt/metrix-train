<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MetriX Train</title>
<meta name="theme-color" content="#07090f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#07090f;--s1:#0f1420;--s2:#161d2d;--line:#252e42;--ink:#eef1f6;--dim:#93a0b4;--acc:#9b7aff;--ok:#3ddc84;--warn:#f5c040}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto;padding:12px 12px 24px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
h2{font-size:22px;margin:6px 0 12px}
h3{font-size:16px;margin:0 0 8px}
p{margin:0 0 8px;color:var(--dim)}
small,.sub{color:var(--dim);font-size:12.5px}
b{font-weight:650}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card.hl{border-color:var(--acc)}
.card.warn{border-color:var(--warn)}
.card ol,.card ul{margin:0 0 8px;padding-left:20px;color:var(--dim)}
.card li{margin-bottom:4px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;border:1px solid var(--acc);color:var(--acc);border-radius:6px;padding:1px 6px;margin-bottom:6px}
.card.warn .tag{border-color:var(--warn);color:var(--warn)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:block;width:100%;background:var(--acc);color:#0b0618;font-weight:700;border-radius:12px;padding:14px;text-align:center;font-size:16px}
.btn.ghost{background:var(--s2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#3a1218;color:#ffb4b4;border:1px solid #6b1f2a}
.row .btn{flex:1;width:auto}
.mini{background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13px;font-weight:600}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.chip{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px}
.chip b{display:block;font-size:12px}
.chip span{display:block;margin-top:2px;font-size:10.5px;font-weight:700;letter-spacing:.4px;color:var(--dim)}
.chip.next{border-color:var(--acc)}.chip.next span{color:var(--acc)}
.chip.dn span{color:var(--ok)}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);color:var(--ink);font-size:14px}
ul.list li:last-child{border:0}ul.list li span{color:var(--dim);white-space:nowrap}
label{display:block;margin-bottom:10px;color:var(--dim);font-size:13px}
label input,label select,textarea{display:block;width:100%;margin-top:4px;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.item{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px}
.item .r{text-align:right}.item small{display:block}
/* workout */
.wh{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:8px 0 10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.wh small{display:block}
.wh .mini{flex:none}
.pad{padding-bottom:96px}
.ex{background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.ex.open{border-color:var(--acc)}
.exh{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;padding:13px 14px}
.exh .cnt{font-weight:700;font-size:13px;white-space:nowrap;border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.ex.complete .cnt{border-color:var(--ok);color:var(--ok)}
.ex>.bd{padding:0 14px 14px}
.cue{color:var(--dim);font-size:13.5px;margin-bottom:8px}
.sug{background:var(--s2);border-radius:10px;padding:9px 10px;font-size:13.5px;margin-bottom:8px}
.sug .mini{margin-left:6px;padding:5px 9px}
.last{font-size:13px;color:var(--dim);margin-bottom:8px}
.cols,.set{display:grid;grid-template-columns:22px 1fr 1fr 58px;gap:6px;align-items:center}
.cols{font-size:11.5px;color:var(--dim);text-align:center}
.set{margin:6px 0}
.set.nw,.cols.nw{grid-template-columns:22px 1fr 58px}
.sn{color:var(--dim);font-weight:700;text-align:center}
.stp{display:flex;align-items:stretch;background:var(--s2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stp button{width:38px;font-size:22px;text-align:center;color:var(--dim)}
.stp input{width:100%;min-width:0;text-align:center;background:transparent;border:0;outline:0;font-weight:650;font-size:17px;height:48px;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dn{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--s2);font-weight:700;font-size:13px;text-align:center}
.set.done .dn{background:var(--ok);border-color:var(--ok);color:#04120a}
.set.done .stp{opacity:.65}
.ex .row{margin-top:8px}
.tbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--s2);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom))}
.tbar .fill{position:absolute;left:0;top:0;height:3px;background:var(--acc);width:0;transition:width .5s linear}
.tin{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tin b{font-size:26px;display:block;line-height:1.1}
/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--s1);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;height:56px;text-align:center;font-size:12px;color:var(--dim);border-top:3px solid transparent}
#tabs button.on{color:var(--ink);font-weight:700;border-top-color:var(--acc)}
.chart{width:100%;height:auto;margin:4px 0 8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);color:var(--dim)}
td:first-child{color:var(--ink)}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg .mini{flex:1;text-align:center}.seg .mini.on{border-color:var(--acc);color:var(--ink);font-weight:700}
.chk{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:15px}.chk input{width:22px;height:22px;margin:0;display:inline-block}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-80px);background:var(--s2);border:1px solid var(--acc);border-radius:10px;padding:10px 14px;z-index:50;transition:transform .25s;max-width:90%}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<main id="app"></main>
<nav id="tabs">
  <button data-go="home">Train</button>
  <button data-go="history">History</button>
  <button data-go="progress">Progress</button>
  <button data-go="info">Info</button>
  <button data-go="settings">Settings</button>
</nav>
<script src="program.js"></script>
<script src="app.js"></script>
</body>
</html>
