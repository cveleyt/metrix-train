.stp{display:flex;align-items:stretch;background:var(--g1);border:1.5px solid var(--line2);border-radius:14px;overflow:hidden}
.stp button{width:38px;font-size:22px;text-align:center;color:var(--dim)}
.stp input{width:100%;min-width:0;text-align:center;background:transparent;border:0;outline:0;font-family:var(--disp);font-weight:700;font-size:26px;height:52px;-moz-appearance:textfield;margin:0;padding:0;border-radius:0}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dn{height:52px;border-radius:14px;border:1.5px solid var(--line2);background:transparent;color:var(--ink2);font-family:var(--mono);font-weight:600;font-size:10.5px;letter-spacing:.6px;text-align:center;text-transform:uppercase}
.set.done .dn{background:var(--ok);border-color:var(--ok);color:#06140c}.set.done .stp{opacity:.65}
.ex .row{margin-top:8px}
.tbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;background:var(--tab);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:22px;padding:10px 14px;overflow:hidden}
.tbar .fill{position:absolute;left:0;top:0;height:3px;background:var(--acc);width:0;transition:width .5s linear}
.tin{max-width:540px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tin b{font-family:var(--disp);font-size:38px;display:block;line-height:1}.tin small{display:block;margin-top:3px}.tin .mini{height:42px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--tab);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim)}
#tabs button svg{width:23px;height:23px}#tabs button.on{color:var(--ink)}#tabs button.on svg{stroke:var(--acct)}
.ovl{position:fixed;inset:0;z-index:30;background:rgba(4,6,18,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadein .3s ease}
.tpop{position:fixed;z-index:31;left:50%;top:50%;width:min(350px,calc(100vw - 28px));transform:translate(-50%,-50%);background:var(--solid);border:1px solid var(--line2);border-radius:30px;padding:22px 18px 18px;text-align:center;animation:popin .45s cubic-bezier(.2,1.5,.4,1);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.tpop .hide{position:absolute;top:12px;right:12px;padding:6px 10px;font-size:12px}
.tpop .pl{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:1.2px;color:var(--acct);margin:0 56px}
.tpop .pw{position:relative;width:250px;height:250px;margin:10px auto 6px}.tpop .pw svg{display:block}
.tpop .pc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tpop .pc b{font-family:var(--disp);font-size:78px;font-weight:700;line-height:1}.tpop .pc small{margin-top:4px}
.tpop .pn{font-size:14px;color:var(--ink2);margin-bottom:14px}.tpop .row{flex-wrap:nowrap}.tpop .btn{padding:13px 10px;font-size:18px}
.tpop.ready .pw{animation:rdy .9s ease-out infinite;border-radius:50%}
@keyframes popin{from{opacity:0;transform:translate(-50%,-46%) scale(.82)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rdy{0%,100%{box-shadow:0 0 0 0 rgba(143,139,255,.5)}50%{box-shadow:0 0 0 20px rgba(143,139,255,0)}}
@media (prefers-reduced-motion:reduce){.tpop,.ovl,.tpop.ready .pw{animation:none}}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-80px);background:var(--solid);border:1px solid var(--acct);border-radius:12px;padding:10px 14px;z-index:50;transition:transform .25s;max-width:90%}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
